name: Preflight Release (no publication)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Canonical CrossTwins tag (need not exist; ct.5 build target)'
        required: true
        default: v1.6.5-ct.5
        type: string
      commit_sha:
        description: 'Full 40-character SHA; must equal the workflow revision'
        required: true
        type: string
      prerelease:
        description: 'Regular release preparation only; must be false'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.contract.outputs.firmware_suffix }}
      short_sha: ${{ steps.contract.outputs.short_sha }}
    steps:
      - name: Reject mismatched revision before checkout
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$COMMIT_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = meat-holic/CrossTwins
          test "$PRERELEASE" = false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate exact source and release contract
        id: contract
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python scripts/release_preflight.py prepare \
            --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" \
            --commit-sha "$COMMIT_SHA" --workflow-sha "$GITHUB_SHA" \
            --prerelease "$PRERELEASE" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output context.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: preflight-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: context.json
          retention-days: 30
          if-no-files-found: error

  checks:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install formatter and host tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21 cmake ninja-build libpcre3
      - name: Check formatting
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code
      - name: Release and preflight contracts
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          python -m unittest discover -s scripts -p 'test_release*.py'
      - name: Full host and OTA regression
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j1
          ./build/test/release_json_parser/ReleaseJsonParserTest --gtest_filter='CrossTwins*'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Check cppcheck
        run: pio check -e default --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build-release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gh_release_rc
            device: x3-x4
          - env: sticky-gh_release_rc
            device: sticky
          - env: x4pro-gh_release_rc
            device: x4pro
          - env: x4c-gh_release_rc
            device: x4c
          - env: papermono-gh_release_rc
            device: papermono
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: preflight-context-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin existing pioarduino core
        env:
          PIO_ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
      - name: Build and validate release image
        env:
          PIO_ENV: ${{ matrix.env }}
          DEVICE: ${{ matrix.device }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CROSSPOINT_RC_SUFFIX: ${{ needs.prepare.outputs.suffix }}
          CROSSPOINT_RC_HASH: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          asset="$(python scripts/release_version.py --tag "$RELEASE_TAG" --base-version \
            "$(sed -n 's/^version = //p' platformio.ini | head -n1)" --prerelease false \
            --device "$DEVICE" | sed -n 's/^asset_name=//p')"
          test -n "$asset"
          pio run -e "$PIO_ENV" -j1
          mkdir staged
          cp ".pio/build/$PIO_ENV/firmware.bin" "staged/$asset"
          python scripts/release_preflight.py validate --context context.json \
            --device "$DEVICE" --environment "$PIO_ENV" --binary "staged/$asset" \
            --elf ".pio/build/$PIO_ENV/firmware.elf" \
            --partitions ".pio/build/$PIO_ENV/partitions.bin" --partition-csv partitions.csv \
            --output "staged/$DEVICE.json"
      - uses: actions/upload-artifact@v6
        with:
          name: verified-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  seal:
    needs: [prepare, checks, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: preflight-context-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: bundle
      - name: Seal all five verified raw binaries
        run: python scripts/release_preflight.py seal --context context.json --directory bundle --output bundle/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: cross-twins-release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
